    else if (a === 'speed') { s.speed = +el.dataset.v; el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); }
    else if (a === 'discard') this.close();
    else if (a === 'save') {
      const fb = readFeedback($('#run'));
      const rec = { ...s.rec, ...fb, date: today(), paceMiss: paceMissOf(s.rec.steps) };
      const id = s.ses.id; this.close();
      const adj = saveLog(id, rec); render(); sheetSession(id);
      toast(adj ? 'Run saved. Your plan adapted.' : 'Run saved');
    }
  },
};
const hav = (a, b) => { const R = 6371e3, r = x => x * Math.PI / 180; const dLa = r(b.latitude - a.latitude), dLo = r(b.longitude - a.longitude); const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.latitude)) * Math.cos(r(b.latitude)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const spokenPace = s => { const x = U() === 'mi' ? s * 1.609344 : s; const m = Math.floor(x / 60), r = Math.round(x % 60); return `${m} ${r ? (r < 10 ? 'oh ' + r : r) : 'flat'}`; };
const spokenDur = s => s < 60 ? `${s} seconds` : s % 60 === 0 ? `${s / 60} minute${s === 60 ? '' : 's'}` : `${Math.floor(s / 60)} minutes ${s % 60} seconds`;

/* =============== Onboarding =============== */
let ob = null;
function obDefaults(fromProfile) {
  const t = today();
  const p = fromProfile;
  return p ? { step: 0, edit: true, goal: p.goal, level: p.level, weeklyKm: p.weeklyKm, fit: p.fitness.kind, fitMeters: p.fitness.meters || 5000, fitSec: p.fitness.seconds || p.fitness.fiveKSeconds || 1620,
    hasTarget: !!p.targetSeconds, target: p.targetSeconds || 0, raceDate: p.raceDate, dateTouched: true, days: [...p.days], longDay: p.longDay, unit: state.settings.unit, watch: state.settings.watch }
    : { step: 0, goal: 'half', level: 1, weeklyKm: 20, fit: 'estimate', fitMeters: 5000, fitSec: 27 * 60, hasTarget: false, target: 0, raceDate: defaultRace('half', t), dateTouched: false, days: [1, 3, 4, 6], longDay: 6, unit: state.settings.unit, watch: state.settings.watch };
}
function defaultRace(goal, t) { return E.addDays(E.mondayOf(t), E.SHAPE[goal].weeks[1] * 7 - 1); }
function obProfile() {
  const fitness = ob.fit === 'race' ? { kind: 'race', meters: ob.fitMeters, seconds: ob.fitSec } : ob.fit === 'new' ? { kind: 'new' } : { kind: 'estimate', fiveKSeconds: ob.fitSec };
  return { goal: ob.goal, level: ob.fit === 'new' ? 0 : ob.level, fitness, targetSeconds: ob.hasTarget && ob.target > 0 ? ob.target : null, raceDate: ob.raceDate,
    startDate: ob.edit && state.profile ? state.profile.startDate : today(), days: ob.days, longDay: ob.days.includes(ob.longDay) ? ob.longDay : ob.days[ob.days.length - 1], weeklyKm: ob.fit === 'new' ? 0 : ob.weeklyKm };
}
const OB_STEPS = ['goal', 'level', 'fitness', 'target', 'days', 'watch', 'summary'];
function openOnboard(edit) { ob = obDefaults(edit ? state.profile : null); $('#onboard').hidden = false; document.body.style.overflow = 'hidden'; renderOb(); }
function closeOnboard() { $('#onboard').hidden = true; $('#onboard').innerHTML = ''; ob = null; document.body.style.overflow = ''; }
function renderOb() {
  const k = OB_STEPS[ob.step];
  const prog = OB_STEPS.slice(0, -1).map((_, i) => `<i class="${i <= ob.step ? 'on' : ''}"></i>`).join('');
  let body = '', can = true, next = 'Continue';
  if (k === 'goal') {
    body = `<h1>What are you training for?</h1><p class="lead">Pick the race distance. You can change it later.</p>
    <div class="opts">${[['5k', '5K', '6–12 weeks', 'Get faster over 5 km or run your first one'], ['10k', '10K', '8–14 weeks', 'Speed and stamina in balance'], ['half', 'Half', '10–16 weeks', '21.1 km of steady strength'], ['marathon', 'Full', '12–20 weeks', '42.2 km, the big one']].map(([g, b, w, d]) =>
      `<button class="opt" data-o="goal" data-v="${g}" aria-pressed="${ob.goal === g}"><span class="big">${b}</span><span><div class="ot">${E.DIST_LABEL[g]} <span class="muted" style="font-weight:600">· ${w}</span></div><div class="od">${d}</div></span></button>`).join('')}</div>`;
  } else if (k === 'level') {
    body = `<h1>How much do you run now?</h1><p class="lead">This sets your starting volume so the first weeks feel right.</p>
    <div class="opts">${[['Beginner', 'Running under a year, or coming back after a break'], ['Intermediate', 'Running regularly and have raced before'], ['Advanced', 'Years of consistent training and structured sessions']].map(([l, d], i) =>
      `<button class="opt" data-o="level" data-v="${i}" aria-pressed="${ob.level === i}"><span><div class="ot">${l}</div><div class="od">${d}</div></span></button>`).join('')}</div>
    <div class="card stack"><div class="row between"><label class="lbl" for="ob-wk">Current weekly distance</label><b class="num" id="ob-wkv">${ob.weeklyKm} km</b></div>
      <input type="range" id="ob-wk" min="0" max="100" step="5" value="${ob.weeklyKm}" data-o="weekly"></div>`;
  } else if (k === 'fitness') {
    const [h, m, s] = hms(ob.fitSec);
    body = `<h1>Where's your fitness today?</h1><p class="lead">Your paces come from this. A recent race is most accurate.</p>
    <div class="seg">${[['race', 'Recent race'], ['estimate', 'Estimate 5K'], ['new', 'I’m new']].map(([v, l]) => `<button data-o="fit" data-v="${v}" aria-pressed="${ob.fit === v}">${l}</button>`).join('')}</div>
    ${ob.fit === 'new' ? `<div class="check good"><b>We'll start with run–walk.</b>Short runs with walk breaks that grow each week until you're running continuously. No pace targets to worry about at first.</div>`
      : `<div class="card stack">${ob.fit === 'race' ? `<div class="field"><label for="ob-fd">Race distance</label><select class="input" id="ob-fd" data-o="fitm">${[[5000, '5K'], [10000, '10K'], [21097.5, 'Half marathon'], [42195, 'Marathon']].map(([v, l]) => `<option value="${v}" ${+ob.fitMeters === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}
        <div class="field"><span class="lbl">${ob.fit === 'race' ? 'Finish time' : 'Your best guess for a 5K today'}</span>${timeInputs('ob-ft', h, m, s)}</div>
        <div class="muted" style="font-size:13px" id="ob-fitout">${fitLine()}</div></div>`}`;
  } else if (k === 'target') {
    const pr = obProfile(); let chk = '';
    try { const pl = E.generate(pr); chk = pr.targetSeconds ? (pl.realistic ? `<div class="check good"><b>Achievable.</b> ${pl.N} weeks is enough to build toward ${E.fmtTime(pr.targetSeconds)}.</div>` : `<div class="check warn"><b>That's a big jump for ${pl.N} weeks.</b> We'll aim for about ${E.fmtTime(pl.suggestedTarget)} and adjust as you improve.</div>`) : `<div class="check"><b>Projected finish: ${E.fmtTime(pl.predicted)}</b> after ${pl.N} weeks of training.</div>`;
      const wk = pl.N, sh = E.SHAPE[ob.goal].weeks; if (wk < sh[0]) chk += `<div class="check warn">Only ${wk} weeks to race day. ${sh[0]}+ is better for a ${E.DIST_LABEL[ob.goal].toLowerCase()}; the plan will be compressed.</div>`; else if (wk > sh[2] + 4) chk += `<div class="check warn">${wk} weeks is a long runway. Consider a later start or a tune-up race.</div>`; } catch (e) { chk = ''; can = false; }
    const [h, m, s] = hms(ob.target || (ob.goal === 'marathon' ? 4 * 3600 : ob.goal === 'half' ? 2 * 3600 : ob.goal === '10k' ? 55 * 60 : 27 * 60));
    body = `<h1>Race day and goal</h1><p class="lead">No race booked? Pick a target date and we'll treat it as one.</p>
    <div class="field"><label for="ob-date">Race date</label><input type="date" class="input" id="ob-date" data-o="date" min="${E.addDays(today(), 14)}" value="${ob.raceDate}"></div>
    <div class="seg">${[[false, 'Finish strong'], [true, 'Target time']].map(([v, l]) => `<button data-o="hastarget" data-v="${v}" aria-pressed="${ob.hasTarget === v}">${l}</button>`).join('')}</div>
    ${ob.hasTarget ? `<div class="field"><span class="lbl">Target time</span>${timeInputs('ob-tt', h, m, s)}</div>` : ''}
    <div class="stack" id="ob-check">${chk}</div>`;
    can = ob.raceDate > E.addDays(today(), 13);
  } else if (k === 'days') {
    body = `<h1>When can you run?</h1><p class="lead">Choose 3 to 6 days. We'll space the hard sessions apart.</p>
    <div class="days7">${WD.map((d, i) => `<button data-o="day" data-v="${i}" aria-pressed="${ob.days.includes(i)}">${d}</button>`).join('')}</div>
    <div class="field"><label for="ob-long">Long run day</label><select class="input" id="ob-long" data-o="long">${ob.days.map(d => `<option value="${d}" ${ob.longDay === d ? 'selected' : ''}>${WD[d]}</option>`).join('')}</select></div>
    <div class="muted" style="font-size:14px">${ob.days.length} runs a week${ob.days.length >= 5 ? ', with two quality sessions' : ', with one quality session'}.</div>`;
    can = ob.days.length >= 3 && ob.days.length <= 6;
  } else if (k === 'watch') {
    body = `<h1>Your watch</h1><p class="lead">Every workout can be sent to your watch with pace targets on each step.</p>
    <div class="opts">${[['both', 'Both', 'Garmin Venu 3S and Apple Watch'], ['garmin', 'Garmin Venu 3S', 'Workouts via Garmin Connect'], ['apple', 'Apple Watch', 'Workouts via the Workout app']].map(([v, t, d]) => `<button class="opt" data-o="watch" data-v="${v}" aria-pressed="${ob.watch === v}"><span><div class="ot">${t}</div><div class="od">${d}</div></span></button>`).join('')}</div>
    <div class="field"><span class="lbl">Units</span><div class="seg">${['km', 'mi'].map(u => `<button data-o="unit" data-v="${u}" aria-pressed="${ob.unit === u}">${u === 'km' ? 'Kilometres' : 'Miles'}</button>`).join('')}</div></div>`;
    next = 'Build my plan';
  } else if (k === 'summary') {
    const pr = obProfile(), pl = E.generate(pr), z = E.paceZones(pl.vdotStart);
    const ph = pl.phases;
    const firstQ = pl.weeks.flatMap(w => w.sessions).find(s => s.type === 'quality' || s.type === 'runwalk');
    body = `<span class="eyebrow">Your plan is ready</span><h1>${pl.N} weeks to your ${E.DIST_LABEL[pr.goal].toLowerCase()}</h1>
    <div class="summary-big"><div class="card"><div class="eyebrow">Projected</div><div class="h-display" style="font-size:36px">${E.fmtTime(pl.predicted)}</div></div>
      <div class="card"><div class="eyebrow">Peak week</div><div class="h-display" style="font-size:36px">${E.fmtDist(pl.peakKm * 1000, ob.unit, 0)} <span style="font-size:20px">${ob.unit}</span></div></div></div>
    <div class="card stack"><div class="phases">${['base', 'build', 'peak', 'taper'].filter(k => ph[k]).map(k => `<i style="flex:${ph[k]};background:var(--ph-${k})"></i>`).join('')}</div>
      <div class="legend">${['base', 'build', 'peak', 'taper'].filter(k => ph[k]).map(k => `<span><i class="dot" style="background:var(--ph-${k})"></i>${k[0].toUpperCase() + k.slice(1)} ${ph[k]} wk</span>`).join('')}</div></div>
    <div class="card" style="padding-block:6px">${['easy', 'threshold', 'interval'].map(k => `<div class="zrow"><span class="zbar" style="background:${zColor(k)}"></span><div class="zn">${E.ZONES[k].label}</div><div class="zp">${E.fmtPace(z[k][0], ob.unit)}–${E.fmtPace(z[k][1], ob.unit)} <small>/${ob.unit}</small></div></div>`).join('')}</div>
    ${firstQ ? `<div class="note">First key session: <b>${esc(firstQ.title)}</b>, ${esc(firstQ.summary)}, on ${dayLabel(firstQ.date)}.</div>` : ''}`;
    next = ob.edit ? 'Save changes' : 'Start training';
  }
  $('#onboard').innerHTML = `<div class="in"><div class="row between"><div class="prog" style="flex:1">${prog}</div><button class="x-btn" data-o="close" aria-label="Close">${ICON.close}</button></div>
    ${body}<div class="foot">${ob.step > 0 ? '<button class="btn" data-o="back">Back</button>' : ''}<button class="btn primary" data-o="next" ${can ? '' : 'disabled'}>${next}</button></div></div>`;
}
function fitLine() {
  if (ob.fit === 'new') return '';
  const v = ob.fit === 'race' ? E.vdotFromRace(ob.fitMeters, ob.fitSec) : E.vdotFromRace(5000, ob.fitSec);
  if (!isFinite(v) || v < 15 || v > 90) return 'Enter a realistic time.';
  return `Fitness score ${v.toFixed(1)} · easy pace ${E.fmtPace(E.paceZones(v).easy[0], ob.unit)}–${E.fmtPace(E.paceZones(v).easy[1], ob.unit)} /${ob.unit}`;
}
function obHandle(el, ev) {
  const a = el.dataset.o, v = el.dataset.v;
  if (ev.type === 'click' && (el.tagName === 'SELECT' || el.type === 'range' || el.type === 'date')) return;
  if (a === 'close') { if (!plan) { loadSample(); render(); } closeOnboard(); return; }
  if (a === 'back') { ob.step--; renderOb(); return; }
  if (a === 'next') {
    if (OB_STEPS[ob.step] === 'summary') {
      const pr = obProfile();
      state.settings.unit = ob.unit; state.settings.watch = ob.watch;
      if (ob.edit) state.profile = pr;
      else state = { ...blank(), settings: state.settings, profile: pr };
      const wasEdit = ob.edit;
      state.sample = false; Store.save(); rebuild(); closeOnboard(); view = 'today'; selDay = null; location.hash = 'today'; render();
      toast(wasEdit ? 'Plan updated' : 'Plan created'); return;
    }
    ob.step++; renderOb(); return;
  }
  if (a === 'goal') { ob.goal = v; if (!ob.dateTouched) ob.raceDate = defaultRace(v, today()); }
  else if (a === 'level') ob.level = +v;
  else if (a === 'weekly') { ob.weeklyKm = +el.value; $('#ob-wkv').textContent = ob.weeklyKm + ' km'; return; }
  else if (a === 'fit') ob.fit = v;
  else if (a === 'fitm') { ob.fitMeters = +el.value; $('#ob-fitout').textContent = fitLine(); return; }
  else if (a === 'date') { if (el.value) { ob.raceDate = el.value; ob.dateTouched = true; } }
  else if (a === 'hastarget') { ob.hasTarget = v === 'true'; if (ob.hasTarget && !ob.target) ob.target = ob.goal === 'marathon' ? 4 * 3600 : ob.goal === 'half' ? 2 * 3600 : ob.goal === '10k' ? 55 * 60 : 27 * 60; }
  else if (a === 'day') { const d = +v; ob.days = ob.days.includes(d) ? ob.days.filter(x => x !== d) : [...ob.days, d].sort((x, y) => x - y); if (!ob.days.includes(ob.longDay) && ob.days.length) ob.longDay = ob.days.includes(6) ? 6 : ob.days[ob.days.length - 1]; }
  else if (a === 'long') ob.longDay = +el.value;
  else if (a === 'watch') ob.watch = v;
  else if (a === 'unit') ob.unit = v;
  renderOb();
}

/* =============== Toast =============== */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

/* =============== Events =============== */
document.addEventListener('click', ev => {
  const r = ev.target.closest('[data-r]'); if (r && $('#run').contains(r)) { if (r.type !== 'range') Run.handle(r); return; }
  const o = ev.target.closest('[data-o]'); if (o && $('#onboard').contains(o)) { obHandle(o, ev); return; }
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (el.tagName === 'SELECT' || el.type === 'checkbox') return;
  switch (a) {
    case 'tab': view = el.dataset.view; location.hash = view; window.scrollTo(0, 0); render(); break;
    case 'day': selDay = el.dataset.d; render(); break;
    case 'open': sheetSession(id); break;
    case 'close': closeSheet(); break;
    case 'run': closeSheet(); Run.open(id); break;
    case 'move': sheetMove(id); break;
    case 'moveto': { const s = byId[id]; if (el.dataset.d === s.planDate) delete state.moves[id]; else state.moves[id] = el.dataset.d; Store.save(); rebuild(); closeSheet(); selDay = el.dataset.d; render(); toast(`Moved to ${dayLabel(el.dataset.d)}`); break; }
    case 'skip': if (state.skipped[id]) delete state.skipped[id]; else state.skipped[id] = true; Store.save(); rebuild(); render(); sheetSession(id); break;
    case 'unlog': delete state.log[id]; Store.save(); rebuild(); render(); sheetSession(id); toast('Result deleted'); break;
    case 'manual': sheetManual(id); break;
    case 'rpe': case 'feel': el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'manualsave': {
      const panel = $('#sheet');
      const dv = parseFloat(($('#ml-d', panel).value || '').replace(',', '.'));
      const t = readTime('ml', panel);
      if (!(dv > 0) || !(t > 0)) { toast('Enter a distance and a time.'); break; }
      const m = U() === 'mi' ? dv * 1609.344 : dv * 1000;
      const adj = saveLog(id, { date: today(), distance: m, duration: t, avgPace: t / m * 1000, splits: [], steps: [], source: 'watch', paceMiss: 0, ...readFeedback(panel) });
      render(); sheetSession(id); toast(adj ? 'Run saved. Your plan adapted.' : 'Run saved'); break;
    }
    case 'export': sheetExport(id); break;
    case 'exptab': exportTab = el.dataset.t; sheetExport(id); break;
    case 'copy': copyText($('#code').textContent); break;
    case 'savefile': { const s = byId[id]; const t = exportTab; saveFile(`${s.date}-${s.title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}${t === 'apple' ? '.swift' : '.json'}`, $('#code').textContent); break; }
    case 'exportplan': {
      const data = JSON.stringify({ app: 'Pacekeeper', version: 1, profile: state.profile, generatedAt: new Date().toISOString(), sessions: sessions.map(s => ({ ...appJSON(s), log: s.log || null, skipped: s.skipped })) }, null, 2);
      if (downloads) saveFile('pacekeeper-plan.json', data); else { openSheet(`${sheetHead('Export', 'Plan JSON')}<pre class="code" id="code">${esc(data)}</pre><button class="btn primary" data-a="copy">Copy</button>`); }
      break;
    }
    case 'dismiss': state.dismissed[el.dataset.k] = true; Store.save(); render(); break;
    case 'onboard': openOnboard(false); break;
    case 'edit': openOnboard(true); break;
    case 'unit': state.settings.unit = el.dataset.u; Store.save(); render(); break;
    case 'shift': state.settings.dayOffset = +el.dataset.n === 0 ? 0 : (state.settings.dayOffset || 0) + +el.dataset.n; selDay = null; Store.save(); render(); break;
    case 'reset': $('#reset-confirm').hidden = false; break;
    case 'reset-no': $('#reset-confirm').hidden = true; break;
    case 'reset-yes': try { localStorage.removeItem(KEY); } catch (e) { } state = blank(); loadSample(); Store.save(); render(); openOnboard(false); break;
    case 'raceupdate': {
      const m = +$('#rr-d').value, t = readTime('rr');
      const v = E.vdotFromRace(m, t);
      if (!t || !isFinite(v) || v < 15 || v > 90) { toast('Enter a realistic race time.'); break; }
      const delta = v - currentVdot();
      state.adjust.push({ from: today(), vdot: +delta.toFixed(2), volume: 1, reason: `New ${{ 5000: '5K', 10000: '10K', 21097.5: 'half marathon', 42195: 'marathon' }[m]} result of ${E.fmtTime(t)}. Paces recalculated.`, at: Date.now() });
      Store.save(); rebuild(); render(); toast(`Fitness ${delta >= 0 ? 'up' : 'down'} ${Math.abs(delta).toFixed(1)}`); break;
    }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.o && ob) obHandle(el, ev);
  else if (el.dataset.a === 'voice') { state.settings.voice = el.checked; Store.save(); }
  else if (el.dataset.a === 'watch') { state.settings.watch = el.value; exportTab = null; Store.save(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.o === 'weekly') obHandle(el, ev);
  if (el.dataset.r === 'effort' && Run.s) { Run.s.effort = +el.value; const t = $('#r-effv'); if (t) t.textContent = Run.s.effort ? (Run.s.effort > 0 ? '+' : '') + Run.s.effort + ' s/km' : 'On target'; }
  if (ob && el.id && el.id.startsWith('ob-ft-')) { ob.fitSec = readTime('ob-ft'); const o = $('#ob-fitout'); if (o) o.textContent = fitLine(); }
  if (ob && el.id && el.id.startsWith('ob-tt-')) { ob.target = readTime('ob-tt'); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['today', 'plan', 'paces', 'you'].includes(h) && h !== view) { view = h; render(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Run.s && Run.s.phase === 'run' && navigator.wakeLock && !Run.wake) navigator.wakeLock.request('screen').then(w => Run.wake = w).catch(() => { }); });

/* =============== Boot =============== */
const saved = Store.loadLocal();
if (saved && saved.profile) state = { ...blank(), ...saved, settings: { ...blank().settings, ...saved.settings } };
else loadSample();
rebuild();
const h0 = location.hash.slice(1); if (['today', 'plan', 'paces', 'you'].includes(h0)) view = h0;
render();
Store.connect();
if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloads = d; }).catch(() => { });
})();
</script>
</body></html>
