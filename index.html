<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EDF0F4"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Pacekeeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>/* Layout: single phone-width column; sticky header, bottom tab bar, bottom sheets, full-screen run mode. */
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --surface-2: #F5F7FA; --ink: #101622; --ink-2: #384254; --muted: #677285; --line: #D8DEE7;
  --accent: #2741D3; --accent-ink: #FFFFFF; --accent-soft: #E2E6FA;
  --good: #1B8F52; --warn: #B87A0B; --bad: #C93C3C; --good-soft: #DFF3E7; --warn-soft: #FBF0D9;
  --z-walk: #A7B1BF; --z-recovery: #7C98B2; --z-easy: #1A9686; --z-long: #2B78C2; --z-marathon: #6A50D4; --z-half: #9B45C2;
  --z-threshold: #D18E12; --z-tenk: #DE6C26; --z-fivek: #DD5527; --z-interval: #D6452A; --z-effort: #C2452E; --z-rep: #BF2C60;
  --ph-base: var(--z-easy); --ph-build: var(--z-threshold); --ph-peak: var(--z-interval); --ph-taper: var(--z-long);
  --shadow: 0 1px 2px rgba(16,22,34,.06), 0 6px 20px rgba(16,22,34,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0F15; --surface: #141A23; --surface-2: #1A212C; --ink: #E8ECF2; --ink-2: #C0C8D5; --muted: #8B96A7; --line: #263041;
  --accent: #8E9DFF; --accent-ink: #0B0F15; --accent-soft: #1D2547;
  --good: #47C27F; --warn: #E9B44A; --bad: #EE6B6B; --good-soft: #15301F; --warn-soft: #33290F;
  --z-walk: #6E7989; --z-recovery: #8FAAC4; --z-easy: #33BBA9; --z-long: #4F99E4; --z-marathon: #8B76EF; --z-half: #BA69DE;
  --z-threshold: #EFAD33; --z-tenk: #F38945; --z-fivek: #F26E46; --z-interval: #F0603F; --z-effort: #E2644B; --z-rep: #E25386;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B0F15; --surface: #141A23; --surface-2: #1A212C; --ink: #E8ECF2; --ink-2: #C0C8D5; --muted: #8B96A7; --line: #263041;
  --accent: #8E9DFF; --accent-ink: #0B0F15; --accent-soft: #1D2547;
  --good: #47C27F; --warn: #E9B44A; --bad: #EE6B6B; --good-soft: #15301F; --warn-soft: #33290F;
  --z-walk: #6E7989; --z-recovery: #8FAAC4; --z-easy: #33BBA9; --z-long: #4F99E4; --z-marathon: #8B76EF; --z-half: #BA69DE;
  --z-threshold: #EFAD33; --z-tenk: #F38945; --z-fivek: #F26E46; --z-interval: #F0603F; --z-effort: #E2644B; --z-rep: #E25386;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, .tnum { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.top .meta { font-size: 13px; color: var(--muted); text-align: right; }
main { display: grid; gap: 14px; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }

/* Generic blocks */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.h-display { font-family: var(--f-display); font-weight: 700; line-height: 1.02; letter-spacing: .005em; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.zbar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--accent-soft); display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 14px; }
.banner.warn { background: var(--warn-soft); }
.banner.good { background: var(--good-soft); }
.banner b { font-weight: 700; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 6px; }
.sec-h h2 { font-family: var(--f-display); font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 0; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { border: 0; background: transparent; border-radius: 12px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 3px; color: var(--ink); }
.day .wd { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.day .dn { font-family: var(--f-display); font-size: 20px; font-weight: 600; line-height: 1; }
.day .mk { height: 14px; display: flex; align-items: center; justify-content: center; }
.day .mk .dot { width: 8px; height: 8px; }
.day.today .dn { color: var(--accent); }
.day[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.mk .ck { width: 14px; height: 14px; color: var(--good); }
.mk .x { width: 12px; height: 12px; color: var(--muted); }

/* Workout hero */
.hero { display: grid; gap: 12px; position: relative; overflow: hidden; }
.hero .t { font-size: 34px; text-transform: uppercase; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stat .v { font-family: var(--f-display); font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.stat .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.prof { width: 100%; height: 56px; display: block; }
.prof.lg { height: 84px; }
.prof rect { shape-rendering: crispEdges; }

/* Lists */
.list { display: grid; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; color: var(--ink); }
.list > .item:first-child { border-top: 0; }
.item .when { width: 44px; flex: none; }
.item .when .wd { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.item .when .dn { font-family: var(--f-display); font-size: 20px; font-weight: 600; line-height: 1.05; }
.item .body { flex: 1; min-width: 0; }
.item .ttl { font-weight: 700; }
.item .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .end { text-align: right; flex: none; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
.item .end .st { font-size: 12px; font-weight: 700; }
.st.done { color: var(--good); } .st.missed { color: var(--bad); } .st.skipped { color: var(--muted); } .st.today { color: var(--accent); }
.item.is-done .ttl, .item.is-skipped .ttl { color: var(--ink-2); }

/* Progress */
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 8px; }

/* Plan chart */
.chart { width: 100%; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--f-body); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .now { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.phases { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; }
.phases i { display: block; height: 100%; }

details.wk { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
details.wk > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
details.wk > summary::-webkit-details-marker { display: none; }
details.wk .wn { font-family: var(--f-display); font-size: 24px; font-weight: 700; width: 34px; line-height: 1; }
details.wk .wbody { padding: 0 16px 6px; }
details.wk[open] .chev { transform: rotate(180deg); }
.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; flex: none; }

/* Pace table */
.zrow { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.zrow:first-child { border-top: 0; }
.zrow .zn { font-weight: 700; }
.zrow .zd { font-size: 13px; color: var(--muted); }
.zrow .zp { font-family: var(--f-display); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.zrow .zp small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 600; }
.preds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pred { background: var(--surface-2); border-radius: 12px; padding: 10px; min-width: 0; }
.pred .l { font-size: 11.5px; color: var(--muted); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.pred .v { font-family: var(--f-display); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.score { font-family: var(--f-display); font-size: 64px; font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; }

/* Forms */
.field { display: grid; gap: 6px; }
.field > label, .lbl { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.input, select.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; min-height: 46px; }
.time3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.time3 .u { position: relative; }
.time3 .u span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.opts { display: grid; gap: 10px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; text-align: left; display: flex; gap: 14px; align-items: center; color: var(--ink); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.opt .big { font-family: var(--f-display); font-size: 30px; font-weight: 700; width: 74px; flex: none; line-height: 1; text-transform: uppercase; }
.opt .ot { font-weight: 700; }
.opt .od { font-size: 13px; color: var(--muted); }
.days7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days7 button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 0; font-weight: 700; font-size: 13px; }
.days7 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.toggle:first-child { border-top: 0; }
.switch { appearance: none; width: 46px; height: 28px; border-radius: 28px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(8,12,18,.45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; justify-content: center; pointer-events: none; }
.sheet .panel { pointer-events: auto; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; background: var(--bg); border-radius: 20px 20px 0 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; animation: up .22s ease-out; }
.grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); justify-self: center; }
.sheet-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-h h2 { font-family: var(--f-display); font-size: 30px; font-weight: 700; text-transform: uppercase; line-height: 1; }
.x-btn { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.x-btn svg { width: 18px; height: 18px; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet .panel { animation: none; } .chev { transition: none; } }

.steps { display: grid; gap: 8px; }
.stp { display: flex; gap: 12px; align-items: stretch; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.stp .sb { flex: 1; min-width: 0; }
.stp .sn { font-weight: 700; }
.stp .sd { font-size: 13px; color: var(--muted); }
.stp .sv { font-family: var(--f-display); font-size: 20px; font-weight: 600; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; align-self: center; }
.rep { border: 1.5px dashed var(--line); border-radius: 14px; padding: 8px; display: grid; gap: 6px; }
.rep > .rh { font-family: var(--f-display); font-size: 18px; font-weight: 700; text-transform: uppercase; padding: 2px 4px; display: flex; justify-content: space-between; }
.note { font-size: 14px; color: var(--ink-2); background: var(--surface); border-radius: 12px; padding: 12px 14px; }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 12px; line-height: 1.5; overflow: auto; max-height: 42vh; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre; }
table.splits { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.splits th { text-align: left; font-size: 11.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 6px 4px; }
table.splits td { padding: 7px 4px; border-top: 1px solid var(--line); }
table.splits td.r, table.splits th.r { text-align: right; }
.ok { color: var(--good); font-weight: 700; } .fast { color: var(--warn); font-weight: 700; } .slow { color: var(--bad); font-weight: 700; }
.tbl-wrap { overflow-x: auto; }
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpe button { border: 0; border-radius: 8px; padding: 10px 0; font-weight: 700; background: var(--surface); font-variant-numeric: tabular-nums; }
.rpe button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Onboarding */
.ob { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto; }
.ob .in { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 18px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ob .prog { display: grid; grid-auto-flow: column; gap: 4px; }
.ob .prog i { height: 4px; border-radius: 4px; background: var(--line); }
.ob .prog i.on { background: var(--accent); }
.ob h1 { font-family: var(--f-display); font-size: 40px; line-height: .98; font-weight: 700; text-transform: uppercase; }
.ob .lead { color: var(--ink-2); margin: -6px 0 0; }
.ob .foot { margin-top: auto; display: flex; gap: 10px; position: sticky; bottom: 0; padding-top: 10px; background: var(--bg); }
.ob .foot .btn.primary { flex: 1; }
.check { font-size: 14px; border-radius: 12px; padding: 12px 14px; background: var(--surface); display: grid; gap: 4px; }
.check.warn { background: var(--warn-soft); }
.check.good { background: var(--good-soft); }
.summary-big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.building { display: grid; place-items: center; gap: 14px; text-align: center; padding: 40px 0; }

/* Run mode */
.run { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow: auto; }
.run .in { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 14px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.cur { border-radius: 18px; padding: 16px; color: #fff; display: grid; gap: 6px; position: relative; overflow: hidden; }
.cur .lab { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .92; }
.cur .big { font-family: var(--f-display); font-size: 76px; font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; }
.cur .tgt { font-family: var(--f-display); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cur .rem { position: absolute; left: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.75); }
.live { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.live .card { padding: 12px 14px; }
.live .v { font-family: var(--f-display); font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.live .l { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.gauge { position: relative; height: 34px; border-radius: 10px; background: var(--surface-2); overflow: hidden; }

<script>/* ============================================================
   Pacekeeper plan engine — pure functions, no DOM.
   Units: distance in metres, time in seconds, pace in sec/km.
   Ports 1:1 to Swift (struct Profile, enum Zone, struct Step…).
   ============================================================ */
const Engine = (() => {
  const DIST = { '5k': 5000, '10k': 10000, half: 21097.5, marathon: 42195 };
  const DIST_LABEL = { '5k': '5K', '10k': '10K', half: 'Half marathon', marathon: 'Marathon' };
  const DAY = 86400000;

  /* ---------- VDOT (Daniels/Gilbert oxygen-cost model) ---------- */
  const vo2 = v => -4.6 + 0.182258 * v + 0.000104 * v * v;           // v in m/min
  const pctMax = t => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t); // t in min
  function vdotFromRace(meters, seconds) {
    const t = seconds / 60, v = meters / t;
    return vo2(v) / pctMax(t);
  }
  function raceTime(vdot, meters) {                                    // seconds
    let lo = 1, hi = 900;
    for (let i = 0; i < 60; i++) {
      const t = (lo + hi) / 2;
      vo2(meters / t) / pctMax(t) > vdot ? (lo = t) : (hi = t);
    }
    return lo * 60;
  }
  function paceAtPct(pct, vdot) {                                      // sec/km
    const a = 0.000104, b = 0.182258, c = -4.6 - pct * vdot;
    const v = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
    return 60000 / v;
  }

  /* ---------- Zones ---------- */
  const ZONES = {
    recovery:  { label: 'Recovery',  short: 'REC', rank: 0 },
    easy:      { label: 'Easy',      short: 'E',   rank: 1 },
    long:      { label: 'Long',      short: 'L',   rank: 1 },
    marathon:  { label: 'Marathon pace', short: 'M', rank: 2 },
    half:      { label: 'Half pace', short: 'HM',  rank: 3 },
    threshold: { label: 'Threshold', short: 'T',   rank: 3 },
    tenk:      { label: '10K pace',  short: '10K', rank: 4 },
    fivek:     { label: '5K pace',   short: '5K',  rank: 4 },
    interval:  { label: 'Interval',  short: 'I',   rank: 4 },
    rep:       { label: 'Repetition', short: 'R',  rank: 5 },
    effort:    { label: 'Hard effort', short: 'H', rank: 4 },
    walk:      { label: 'Walk',      short: 'W',   rank: -1 },
  };
  function paceZones(vdot) {
    const rp = m => raceTime(vdot, m) / (m / 1000);
    const band = (p, w) => [p - w, p + w];
    const eFast = paceAtPct(0.71, vdot), eSlow = paceAtPct(0.63, vdot);
    return {
      recovery: [eSlow, eSlow + 35],
      easy: [eFast, eSlow],
      long: [eFast + 5, eSlow],
      marathon: band(rp(42195), 5),
      half: band(rp(21097.5), 4),
      threshold: band(paceAtPct(0.88, vdot), 4),
      tenk: band(rp(10000), 4),
      fivek: band(rp(5000), 3),
      interval: band(paceAtPct(0.96, vdot), 3),
      rep: band(paceAtPct(1.04, vdot), 3),
      effort: null, walk: null,
    };
  }

  /* ---------- Step builders ---------- */
  // A step: { kind:'warmup'|'work'|'recover'|'cooldown', zone, dur:{type:'distance'|'time', value} }
  // A repeat: { repeat:n, steps:[step,…] }
  const S = (kind, zone, type, value, note) => ({ kind, zone, dur: { type, value: Math.round(value) }, ...(note ? { note } : {}) });
  const R = (n, steps) => ({ repeat: n, steps });
  const km = x => Math.round(x * 10) * 100;                            // round to 0.1 km, in metres

  function flatten(steps) {
    const out = [];
    steps.forEach(s => s.repeat ? [...Array(s.repeat)].forEach((_, i) => s.steps.forEach(t => out.push({ ...t, rep: i + 1, of: s.repeat }))) : out.push(s));
    return out;
  }
  function stepPace(step, zones) {
    if (step.zone === 'walk') return 600;
    if (step.zone === 'effort') return (zones.interval[0] + zones.interval[1]) / 2 + 25; // uphill is slower
    const z = zones[step.zone];
    return (z[0] + z[1]) / 2;
  }
  function estimate(steps, zones) {
    let d = 0, t = 0;
    flatten(steps).forEach(s => {
      const p = stepPace(s, zones);
      if (s.dur.type === 'distance') { d += s.dur.value; t += s.dur.value / 1000 * p; }
      else { t += s.dur.value; d += s.dur.value / p * 1000; }
    });
    return { distance: d, duration: t };
  }

  /* ---------- Session library ---------- */
  // Each returns { type, title, summary, steps }. `x` (0..1) = progression within phase.
  const WU = (m = 2000) => S('warmup', 'easy', 'distance', m);
  const CD = (m = 1500) => S('cooldown', 'easy', 'distance', m);
  const lerp = (a, b, x) => a + (b - a) * x;
  const LIB = {
    easy: (dist) => ({ type: 'easy', title: 'Easy run', summary: `${(dist / 1000).toFixed(1)} km conversational`, steps: [S('work', 'easy', 'distance', dist)] }),
    recovery: (dist) => ({ type: 'recovery', title: 'Recovery run', summary: `${(dist / 1000).toFixed(1)} km very easy`, steps: [S('work', 'recovery', 'distance', dist)] }),
    strides: (dist) => ({ type: 'easy', title: 'Easy + strides', summary: `${(dist / 1000).toFixed(1)} km easy, 6 × 20 s strides`,
      steps: [S('work', 'easy', 'distance', Math.max(2000, dist - 800)), R(6, [S('work', 'rep', 'time', 20, 'Fast, relaxed, not a sprint'), S('recover', 'walk', 'time', 60)])] }),
    runwalk: (x) => {
      const run = Math.round(lerp(1, 8, x)), walk = x > 0.8 ? 1 : 2, n = Math.max(3, Math.round(lerp(8, 4, x)));
      return { type: 'runwalk', title: 'Run–walk', summary: `${n} × ${run} min run / ${walk} min walk`,
        steps: [S('warmup', 'walk', 'time', 300), R(n, [S('work', 'easy', 'time', run * 60), S('recover', 'walk', 'time', walk * 60)]), S('cooldown', 'walk', 'time', 300)] };
    },
    long: (dist, finish) => {
      if (finish && finish.dist) {
        const fin = finish.dist, easy = Math.max(3000, dist - fin);
        return { type: 'long', title: 'Long run, fast finish', summary: `${(dist / 1000).toFixed(0)} km with last ${(fin / 1000).toFixed(0)} km at ${ZONES[finish.zone].label.toLowerCase()}`,
          steps: [S('work', 'long', 'distance', easy), S('work', finish.zone, 'distance', fin, 'Settle in, don’t race it')] };
      }
      return { type: 'long', title: 'Long run', summary: `${(dist / 1000).toFixed(0)} km steady and easy`, steps: [S('work', 'long', 'distance', dist)] };
    },
    fartlek: (x) => { const n = Math.round(lerp(6, 10, x));
      return { type: 'quality', title: 'Fartlek', summary: `${n} × 2 min brisk / 1 min easy`,
        steps: [WU(1500), R(n, [S('work', 'tenk', 'time', 120), S('recover', 'easy', 'time', 60)]), CD()] }; },
    hills: (x) => { const n = Math.round(lerp(6, 10, x));
      return { type: 'quality', title: 'Hill repeats', summary: `${n} × 75 s uphill, jog down`,
        steps: [WU(2000), R(n, [S('work', 'effort', 'time', 75, 'Strong uphill, tall posture, drive arms'), S('recover', 'recovery', 'time', 120, 'Jog back down')]), CD()] }; },
    progression: (dist) => ({ type: 'quality', title: 'Progression run', summary: 'Easy into marathon into threshold',
      steps: [S('work', 'easy', 'distance', km(dist * 0.5 / 1000)), S('work', 'marathon', 'distance', km(dist * 0.3 / 1000)), S('work', 'threshold', 'distance', km(dist * 0.2 / 1000))] }),
    tempo: (x) => { const min = Math.round(lerp(15, 30, x) / 5) * 5;
      return { type: 'quality', title: 'Tempo run', summary: `${min} min at threshold`,
        steps: [WU(2000), S('work', 'threshold', 'time', min * 60, 'Comfortably hard, could speak a few words'), CD()] }; },
    cruise: (x) => { const n = Math.round(lerp(3, 6, x));
      return { type: 'quality', title: 'Cruise intervals', summary: `${n} × 1.6 km at threshold`,
        steps: [WU(2000), R(n, [S('work', 'threshold', 'distance', 1600), S('recover', 'recovery', 'time', 60)]), CD()] }; },
    intervals: (x, weekly) => {
      const rep = [800, 1000, 1200][Math.min(2, Math.floor(x * 3))];
      const cap = Math.min(8000, weekly * 0.08);                         // ≤8% of weekly volume at I
      const n = Math.max(3, Math.min(8, Math.floor(cap / rep)));
      return { type: 'quality', title: 'Intervals', summary: `${n} × ${rep} m at interval pace`,
        steps: [WU(2000), R(n, [S('work', 'interval', 'distance', rep), S('recover', 'recovery', 'time', Math.round(rep / 1000 * 150))]), CD()] };
    },
    reps: (x) => { const n = Math.round(lerp(8, 12, x));
      return { type: 'quality', title: 'Speed reps', summary: `${n} × 200 m fast`,
        steps: [WU(2000), R(n, [S('work', 'rep', 'distance', 200), S('recover', 'recovery', 'distance', 200)]), CD()] }; },
    racepace: (goal, x) => {
      const P = {
        '5k':      () => { const n = Math.round(lerp(4, 6, x)); return [`${n} × 1 km at 5K pace`, R(n, [S('work', 'fivek', 'distance', 1000), S('recover', 'recovery', 'time', 120)])]; },
        '10k':     () => { const n = Math.round(lerp(3, 5, x)); return [`${n} × 2 km at 10K pace`, R(n, [S('work', 'tenk', 'distance', 2000), S('recover', 'recovery', 'time', 120)])]; },
        half:      () => { const d = Math.round(lerp(3, 5, x)); return [`2 × ${d} km at half pace`, R(2, [S('work', 'half', 'distance', d * 1000), S('recover', 'recovery', 'time', 180)])]; },
        marathon:  () => { const d = Math.round(lerp(8, 16, x)); return [`${d} km at marathon pace`, S('work', 'marathon', 'distance', d * 1000, 'Practise race-day fuelling')]; },
      }[goal]();
      return { type: 'quality', title: 'Race-pace session', summary: P[0], steps: [WU(2000), P[1], CD()] };
    },
    sharpener: (goal) => {
      const z = { '5k': 'fivek', '10k': 'tenk', half: 'half', marathon: 'marathon' }[goal];
      return { type: 'quality', title: 'Race sharpener', summary: `5 × 400 m at ${ZONES[z].label.toLowerCase()}`,
        steps: [WU(2000), R(5, [S('work', z, 'distance', 400), S('recover', 'recovery', 'time', 90)]), CD()] };
    },
    shakeout: () => ({ type: 'easy', title: 'Shakeout', summary: '3 km easy + 4 strides',
      steps: [S('work', 'easy', 'distance', 3000), R(4, [S('work', 'rep', 'time', 15), S('recover', 'walk', 'time', 45)])] }),
    race: (goal) => ({ type: 'race', title: `Race day: ${DIST_LABEL[goal]}`, summary: 'Go get it',
      steps: [S('work', { '5k': 'fivek', '10k': 'tenk', half: 'half', marathon: 'marathon' }[goal], 'distance', DIST[goal])] }),
  };

  /* ---------- Plan shape tables ---------- */
  const SHAPE = {
    //           weeks: min,default,max  taper   peak km by level            long cap  start floor
    '5k':       { weeks: [6, 8, 12],    taper: [0.6],              peak: [22, 35, 50],  longCap: [8, 12, 15],  floor: 10 },
    '10k':      { weeks: [8, 10, 14],   taper: [0.6],              peak: [28, 42, 60],  longCap: [10, 15, 19], floor: 14 },
    half:       { weeks: [10, 12, 16],  taper: [0.75, 0.5],        peak: [35, 50, 70],  longCap: [16, 20, 24], floor: 18 },
    marathon:   { weeks: [12, 16, 20],  taper: [0.8, 0.6, 0.4],    peak: [45, 62, 85],  longCap: [29, 32, 34], floor: 25 },
  };
  const LEVELS = ['beginner', 'intermediate', 'advanced'];

  /* ---------- Date helpers (local dates as yyyy-mm-dd) ---------- */
  const iso = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const mondayOf = s => { const d = parse(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); };
  const weekday = s => (parse(s).getDay() + 6) % 7;                    // 0 = Mon
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / DAY);

  /* ---------- Fitness ---------- */
  function baseVdot(p) {
    if (p.fitness.kind === 'race') return vdotFromRace(p.fitness.meters, p.fitness.seconds);
    if (p.fitness.kind === 'new') return 28;
    return vdotFromRace(5000, p.fitness.fiveKSeconds);                 // estimate
  }
  function gainCap(weeks, level) { return Math.min([2.5, 3.5, 4][level], weeks / 4.5); }

  /* ---------- Plan generation ---------- */
  // profile: { goal, level(0-2), fitness, targetSeconds|null, raceDate, startDate, days:[0-6], longDay, weeklyKm, createdOn }
  // adjust:  [{ from:'yyyy-mm-dd', vdot:+0.5, volume:0.9 }]  — applied to sessions on/after `from`
  function generate(profile, adjust = []) {
    const shape = SHAPE[profile.goal];
    const lvl = profile.level;
    const start = mondayOf(profile.startDate);
    const raceDate = profile.raceDate;
    const N = Math.max(1, Math.ceil((daysBetween(start, raceDate) + 1) / 7));
    const T = Math.min(shape.taper.length, Math.max(0, N - 3));
    const B = N - T;
    const nBase = Math.max(1, Math.round(B * 0.3)), nBuild = Math.max(1, Math.round(B * 0.4));
    const phaseOf = w => w >= B ? 'taper' : w < nBase ? 'base' : w < nBase + nBuild ? 'build' : 'peak';

    const v0 = baseVdot(profile);
    const cap = gainCap(N, lvl);
    const goalV = profile.targetSeconds ? vdotFromRace(DIST[profile.goal], profile.targetSeconds) : null;
    const gain = goalV ? Math.max(0, Math.min(goalV - v0, cap)) : cap * 0.7;
    const vEnd = v0 + gain;
    const realistic = !goalV || goalV <= v0 + cap + 0.3;
    const isNew = profile.fitness.kind === 'new';

    // Weekly volume curve
    const startKm = Math.max(isNew ? 8 : shape.floor * (lvl === 0 ? 0.8 : 1), profile.weeklyKm || 0);
    const longGoal = profile.goal === 'half' || profile.goal === 'marathon';
    const peakKm = Math.max(startKm, Math.min(shape.peak[lvl], Math.max(startKm * (longGoal ? 1.75 : 1.6), shape.peak[0])));
    const rwWeeks = isNew ? Math.max(2, Math.ceil(B * 0.5)) : 0;      // new runners: run–walk until continuous
    const vols = [];
    let v = startKm;
    for (let w = 0; w < B; w++) {
      if (w > 0) v = Math.min(peakKm, v * 1.09);
      vols.push(w % 4 === 3 && w < B - 1 ? v * 0.8 : v);
    }
    for (let t = 0; t < T; t++) vols.push(peakKm * shape.taper[t]);

    const adjAt = date => adjust.filter(a => a.from <= date).reduce((acc, a) => ({ vdot: acc.vdot + (a.vdot || 0), volume: acc.volume * (a.volume || 1) }), { vdot: 0, volume: 1 });

    // Day assignment (circular gaps to keep hard days apart)
    const days = [...new Set(profile.days)].sort((a, b) => a - b);
    const longDay = days.includes(profile.longDay) ? profile.longDay : days[days.length - 1];
    const gap = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 7 - d); };
    const others = days.filter(d => d !== longDay);
    // Score a choice of hard days: maximise the smallest gap, then the total gap, and avoid the day right after the long run.
    const score = set => { const all = [longDay, ...set]; let mn = 9, sum = 0;
      for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) { const g = gap(all[i], all[j]); mn = Math.min(mn, g); sum += g; }
      return mn * 100 + sum * 10 - set.filter(d => d === (longDay + 1) % 7).length * 5 - set.reduce((a, d) => a + d, 0) * 0.01; };
    const nQ = days.length >= 5 ? 2 : 1;
    let q1 = null, q2 = null;
    if (nQ === 1 && others.length) q1 = others.slice().sort((a, b) => score([b]) - score([a]))[0];
    if (nQ === 2) { let best = -1e9;
      for (const a of others) for (const b of others) if (a < b) { const sc = score([a, b]); if (sc > best) { best = sc; q1 = a; q2 = b; } } }

    const weeks = [];
    let counters = {};
    const rot = (key, list) => { counters[key] = (counters[key] || 0) + 1; return list[(counters[key] - 1) % list.length]; };

    for (let w = 0; w < N; w++) {
      const phase = phaseOf(w);
      const wStart = addDays(start, w * 7);
      const sameP = [...Array(N).keys()].filter(i => phaseOf(i) === phase);
      const x = sameP.length > 1 ? sameP.indexOf(w) / (sameP.length - 1) : 1;
      const isRaceWeek = w === N - 1;
      const raceWd = weekday(raceDate);
      const sessions = [];
      const vol = vols[w] * 1000;
      const longShare = lvl === 0 ? 0.32 : 0.3;
      const longCap = shape.longCap[lvl] * 1000;
      const beginnerRW = w < rwWeeks;
      const rwX = Math.min(1, (w + 1) / rwWeeks);

      const qType = (slot) => {
        if (beginnerRW) return 'runwalk';
        if (phase === 'base') return slot === 1 ? rot('b1', isNew ? ['fartlek', 'strides'] : ['fartlek', 'hills', 'progression']) : 'strides';
        if (phase === 'taper') return slot === 1 ? 'sharpener' : 'strides';
        if (isNew) return rot('new' + slot, phase === 'build' ? ['fartlek', 'tempo'] : ['racepace', 'tempo']);
        const g = profile.goal;
        const table = {
          build: { '5k': [['intervals'], ['tempo', 'cruise']], '10k': [['cruise', 'tempo'], ['intervals']], half: [['tempo', 'cruise'], ['intervals', 'fartlek']], marathon: [['tempo', 'cruise'], ['racepace']] },
          peak:  { '5k': [['racepace', 'reps'], ['tempo']], '10k': [['racepace'], ['intervals', 'cruise']], half: [['racepace'], ['cruise', 'intervals']], marathon: [['cruise', 'tempo'], ['racepace']] },
        }[phase][g];
        if (nQ === 1) return rot('q' + phase, w % 2 === 0 ? table[0] : table[1]);  // alternate the two themes
        return rot(`q${slot}${phase}`, table[slot - 1]);
      };

      const make = (type, opts = {}) => {
        switch (type) {
          case 'runwalk': return LIB.runwalk(rwX);
          case 'fartlek': return LIB.fartlek(x);
          case 'hills': return LIB.hills(x);
          case 'progression': return LIB.progression(Math.max(5000, vol * 0.18));
          case 'tempo': return LIB.tempo(x);
          case 'cruise': return LIB.cruise(x);
          case 'intervals': return LIB.intervals(x, vol);
          case 'reps': return LIB.reps(x);
          case 'racepace': return LIB.racepace(profile.goal, x);
          case 'sharpener': return LIB.sharpener(profile.goal);
          case 'strides': return LIB.strides(opts.dist || 5000);
        }
      };

      if (isRaceWeek) {
        // Race week: easy early, sharpener mid-week, shakeout the day before, race.
        const before = days.filter(d => d < raceWd);
        const sh = before.includes(raceWd - 1) ? raceWd - 1 : null;
        before.forEach((d, i) => {
          let s;
          if (d === sh) s = LIB.shakeout();
          else if (i === 0 && before.length > 2 && profile.goal !== '5k') s = LIB.sharpener(profile.goal);
          else s = LIB.strides(Math.max(4000, Math.min(8000, vol * 0.2)));
          sessions.push({ day: d, ...s });
        });
        sessions.push({ day: raceWd, ...LIB.race(profile.goal) });
      } else {
        // Long run
        // Long run ramps from today's long run to the cap by two weeks before the taper, bounded by a share of the week.
        const maxShare = { '5k': 0.35, '10k': 0.36, half: 0.42, marathon: 0.55 }[profile.goal];
        const startLong = Math.max(lvl === 0 ? 4000 : 6000, Math.min(longCap, startKm * 1000 * 0.33));
        let longDist;
        if (phase === 'taper') longDist = longCap * shape.taper[w - B] * 0.85;
        else {
          longDist = lerp(startLong, longCap, Math.min(1, w / Math.max(1, B - 3)));
          if (w % 4 === 3 && w < B - 1) longDist *= 0.75;
        }
        longDist = Math.max(lvl === 0 ? 3000 : 5000, Math.min(longDist, vol * maxShare));
        let finish = null;
        if (phase === 'peak' && (profile.goal === 'marathon' || profile.goal === 'half') && w % 2 === 0) finish = { zone: profile.goal === 'marathon' ? 'marathon' : 'half', dist: Math.round(lerp(4, profile.goal === 'marathon' ? 10 : 5, x)) * 1000 };
        const longS = beginnerRW ? LIB.runwalk(Math.min(1, rwX + 0.1)) : LIB.long(km(longDist / 1000), finish);
        if (beginnerRW) longS.title = 'Longer run–walk';
        sessions.push({ day: longDay, ...longS });
        if (q1 != null) sessions.push({ day: q1, ...make(qType(1)) });
        if (q2 != null) sessions.push({ day: q2, ...make(qType(2), { dist: 5000 }) });
        // Fill easy days with the remaining volume
        const used = sessions.reduce((a, s) => a + estimate(s.steps, paceZones(v0)).distance, 0);
        const easyDays = others.filter(d => d !== q1 && d !== q2);
        const each = easyDays.length ? Math.max(lvl === 0 ? 3000 : 4000, Math.min(Math.max(6000, longDist * 0.7), (vol - used) / easyDays.length)) : 0;
        easyDays.forEach((d, i) => {
          const s = beginnerRW ? LIB.runwalk(rwX) : (i === easyDays.length - 1 && days.length >= 4 && phase !== 'base' && nQ === 1 ? LIB.strides(km(each / 1000)) : LIB.easy(km(each / 1000)));
          sessions.push({ day: d, ...s });
        });
      }

      // Dates, ids, paces
      const fracW = N > 1 ? w / (N - 1) : 1;
      const list = sessions.sort((a, b) => a.day - b.day).map((s, i) => {
        const date = addDays(wStart, s.day);
        const a = adjAt(date);
        const vd = v0 + gain * fracW + a.vdot;
        const zones = paceZones(vd);
        // goal-pace zones lock to the goal (if realistic) for race-specific work
        if (goalV && realistic) {
          const gz = paceZones(goalV + a.vdot * 0.5);
          zones[{ '5k': 'fivek', '10k': 'tenk', half: 'half', marathon: 'marathon' }[profile.goal]] = gz[{ '5k': 'fivek', '10k': 'tenk', half: 'half', marathon: 'marathon' }[profile.goal]];
        }
        let steps = s.steps;
        if (a.volume !== 1 && s.type !== 'race') steps = scaleSteps(steps, a.volume);
        const est = estimate(steps, zones);
        const mainZone = flatten(steps).filter(t => t.kind === 'work').sort((p, q) => ZONES[q.zone].rank - ZONES[p.zone].rank)[0]?.zone || 'easy';
        return { id: `w${w + 1}-${s.day}`, week: w + 1, date, day: s.day, type: s.type, title: s.title, summary: s.summary, steps, zones, vdot: vd, mainZone, ...est };
      }).filter(s => s.date >= profile.startDate);

      weeks.push({ n: w + 1, start: wStart, phase, targetKm: vols[w], sessions: list, plannedKm: list.reduce((a, s) => a + s.distance, 0) / 1000 });
    }

    return {
      weeks, N, phases: { base: nBase, build: nBuild, peak: B - nBase - nBuild, taper: T },
      vdotStart: v0, vdotEnd: vEnd, goalVdot: goalV, realistic,
      predicted: raceTime(vEnd + adjAt(raceDate).vdot, DIST[profile.goal]),
      suggestedTarget: goalV && !realistic ? raceTime(v0 + cap, DIST[profile.goal]) : null,
      peakKm, startKm,
    };
  }
  function scaleSteps(steps, f) {
    return steps.map(s => s.repeat ? s : (s.kind === 'work' && s.dur.type === 'distance' && s.zone !== 'rep') ? { ...s, dur: { ...s.dur, value: km(s.dur.value * f / 1000) } } : s);
  }

  /* ---------- Adaptation ---------- */
  // Looks at recent completed sessions and proposes a change. Returns null or {vdot, volume, reason}.
  function adapt(recent) {
    const q = recent.filter(r => r.type === 'quality').slice(-3);
    const hard = q.filter(r => r.feel === 'hard' || r.paceMiss > 0.03).length;
    const easy = q.filter(r => r.feel === 'easy' && r.paceMiss <= 0).length;
    const e = recent.filter(r => r.type === 'easy' || r.type === 'long').slice(-2);
    if (q.length >= 2 && hard >= 2) return { vdot: -0.6, reason: 'Your last hard sessions felt tougher than planned, so upcoming paces ease off a little.' };
    if (q.length >= 2 && easy >= 2) return { vdot: +0.5, reason: 'You’ve been hitting your targets comfortably, so upcoming paces step up slightly.' };
    if (e.length === 2 && e.every(r => r.rpe >= 7)) return { volume: 0.9, reason: 'Easy runs have felt hard twice in a row. Next week’s distances drop 10% to let you absorb the training.' };
    return null;
  }

  /* ---------- Formatting ---------- */
  const fmtPace = (s, unit = 'km') => { if (s == null || !isFinite(s)) return '–:––'; const x = unit === 'mi' ? s * 1.609344 : s; const m = Math.floor(x / 60), r = Math.round(x % 60); return r === 60 ? `${m + 1}:00` : `${m}:${String(r).padStart(2, '0')}`; };
  const fmtTime = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}` : `${m}:${String(r).padStart(2, '0')}`; };
  const fmtDist = (m, unit = 'km', dp = 1) => (unit === 'mi' ? m / 1609.344 : m / 1000).toFixed(dp);

  return { DIST, DIST_LABEL, ZONES, SHAPE, LEVELS, vdotFromRace, raceTime, paceZones, generate, flatten, estimate, stepPace, adapt, iso, parse, addDays, mondayOf, weekday, daysBetween, fmtPace, fmtTime, fmtDist };
})();

<script>(() => {
const E = Engine;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const ICON = {
  logo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13l3.5-3.5M10 2h4M12 2v3"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 4a2 2 0 1 0 0 .01M8 21l3-6 3 3v3M6 12l3-4 4 1 3 4 3 1"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  paces: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg>',
  you: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  check: '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross: '<svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
};

/* =============== State & storage =============== */
const KEY = 'pacekeeper.v1';
const blank = () => ({ v: 1, sample: false, profile: null, adjust: [], moves: {}, log: {}, skipped: {}, dismissed: {}, settings: { unit: 'km', voice: true, watch: 'both', dayOffset: 0 }, updatedAt: 0 });
let state = blank();
let plan = null, sessions = [], byId = {};
let view = 'today', selDay = null;

const Store = {
  ref: null, timer: null, busy: false, again: false,
  loadLocal() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  save() {
    state.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { }
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 700);
  },
  async flush() {
    if (!this.ref) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try { await this.ref.set({ json: JSON.stringify(state), updatedAt: state.updatedAt }); } catch (e) { console.warn('sync failed', e); }
    this.busy = false;
    if (this.again) { this.again = false; this.flush(); }
  },
  async connect() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.ref = db.doc('data/users/' + id + '/state');
      const snap = await this.ref.get();
      if (snap.exists) {
        const remote = JSON.parse(snap.data().json || 'null');
        if (remote && (remote.updatedAt || 0) > (state.updatedAt || 0)) { state = { ...blank(), ...remote, settings: { ...blank().settings, ...remote.settings } }; rebuild(); render(); }
      } else if (state.profile && !state.sample) this.flush();
    } catch (e) { console.warn('db unavailable', e); }
  },
};

/* =============== Dates & units =============== */
const today = () => { const d = new Date(); d.setDate(d.getDate() + (state.settings.dayOffset || 0)); return E.iso(d); };
const U = () => state.settings.unit;
const dist = (m, dp = 1) => `${E.fmtDist(m, U(), dp)} ${U()}`;
const pace = s => `${E.fmtPace(s, U())}/${U()}`;
const range = r => `${E.fmtPace(r[0], U())}–${E.fmtPace(r[1], U())}`;
const fmtDur = s => s < 60 ? `${s} s` : s % 60 === 0 ? `${s / 60} min` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} min`;
const dayLabel = iso => { const d = E.parse(iso); return `${WD[(d.getDay() + 6) % 7]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const rel = iso => { const n = E.daysBetween(today(), iso); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : dayLabel(iso); };

/* =============== Plan derivation =============== */
function rebuild() {
  if (!state.profile) { plan = null; sessions = []; byId = {}; return; }
  plan = E.generate(state.profile, state.adjust);
  sessions = []; byId = {};
  plan.weeks.forEach(w => w.sessions.forEach(s => {
    s.planDate = s.date;
    if (state.moves[s.id]) s.date = state.moves[s.id];
    s.log = state.log[s.id] || null; s.skipped = !!state.skipped[s.id];
    sessions.push(s); byId[s.id] = s;
  }));
  sessions.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  plan.weeks.forEach(w => { w.doneKm = w.sessions.reduce((a, s) => a + (s.log ? s.log.distance : 0), 0) / 1000; });
}
const status = s => s.log ? 'done' : s.skipped ? 'skipped' : s.date < today() ? 'missed' : s.date === today() ? 'today' : 'upcoming';
function weekOf(iso) {
  const ws = plan.weeks;
  return ws.find(w => iso >= w.start && iso <= E.addDays(w.start, 6)) || (iso < ws[0].start ? ws[0] : ws[ws.length - 1]);
}
const nextSession = () => sessions.find(s => s.date >= today() && !s.log && !s.skipped);
const currentVdot = () => (nextSession() || sessions[sessions.length - 1]).vdot;
const raceSession = () => sessions.find(s => s.type === 'race');

/* =============== Workout helpers =============== */
const RANK_H = { walk: .16, recovery: .3, easy: .45, long: .45, marathon: .6, half: .7, threshold: .74, tenk: .84, fivek: .88, interval: .9, effort: .86, rep: 1 };
const zColor = z => `var(--z-${z})`;
function stepName(st) {
  if (st.kind === 'warmup') return st.zone === 'walk' ? 'Warm-up walk' : 'Warm up';
  if (st.kind === 'cooldown') return st.zone === 'walk' ? 'Cool-down walk' : 'Cool down';
  if (st.zone === 'walk') return 'Walk';
  if (st.kind === 'recover') return st.zone === 'recovery' ? 'Recovery jog' : 'Recover';
  return E.ZONES[st.zone].label;
}
function durText(d) {
  if (d.type === 'time') return fmtDur(d.value);
  if (d.value < (U() === 'mi' ? 1609 : 1000)) return `${d.value} m`;
  return dist(d.value, d.value % 1000 === 0 && U() === 'km' ? 0 : 1);
}
function targetText(st, zones) {
  if (st.zone === 'walk') return 'Brisk walk';
  if (st.zone === 'effort') return 'By effort';
  return `${range(zones[st.zone])} /${U()}`;
}
function profileSVG(s, cls = '') {
  const flat = E.flatten(s.steps);
  const parts = flat.map(st => { const p = E.stepPace(st, s.zones); return { st, t: st.dur.type === 'time' ? st.dur.value : st.dur.value / 1000 * p }; });
  const total = parts.reduce((a, p) => a + p.t, 0) || 1;
  const H = 60, W = 1000, gap = flat.length > 40 ? 1 : 3;
  let x = 0;
  const rects = parts.map(p => {
    const w = Math.max(2, p.t / total * W - gap), h = Math.max(6, RANK_H[p.st.zone] * H);
    const r = `<rect x="${x.toFixed(1)}" y="${(H - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${zColor(p.st.zone)}"/>`;
    x += p.t / total * W; return r;
  }).join('');
  return `<svg class="prof ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Intensity profile">${rects}</svg>`;
}
function stepsHTML(s) {
  const one = st => `<div class="stp"><span class="zbar" style="background:${zColor(st.zone)}"></span>
    <div class="sb"><div class="sn">${esc(stepName(st))}</div><div class="sd">${esc(targetText(st, s.zones))}${st.note ? ' · ' + esc(st.note) : ''}</div></div>
    <div class="sv">${esc(durText(st.dur))}</div></div>`;
  return s.steps.map(st => st.repeat ? `<div class="rep"><div class="rh"><span>Repeat ${st.repeat}×</span></div>${st.steps.map(one).join('')}</div>` : one(st)).join('');
}
const WHY = {
  easy: 'Easy running builds your aerobic engine with little fatigue. Keep it conversational; going faster here only steals energy from the hard days.',
  recovery: 'A short, very easy run to move blood through tired legs. Slower than you think.',
  long: 'The long run builds endurance, fat-burning and the mental habit of time on feet. Even, relaxed pacing.',
  quality: 'This is a key session for the week. Warm up properly, hit the target paces on the work segments and keep the recoveries truly easy.',
  runwalk: 'Run–walk builds the habit and the tendons safely. The run segments grow week by week until you run continuously.',
  race: 'Start a touch conservative for the first kilometre, settle into goal pace, and save something for the final third.',
};
const sessionKm = s => s.log ? s.log.distance : s.distance;

/* =============== Sample data (first open) =============== */
function loadSample() {
  const t = today();
  const start = E.addDays(t, -10);
  const raceDate = E.addDays(E.mondayOf(start), 12 * 7 + 6);
  state = { ...blank(), settings: state.settings, sample: true,
    profile: { goal: 'half', level: 1, fitness: { kind: 'estimate', fiveKSeconds: 25 * 60 + 30 }, targetSeconds: 1 * 3600 + 55 * 60, raceDate, startDate: start, days: [1, 3, 4, 6], longDay: 6, weeklyKm: 25 } };
  rebuild();
  // Fake a few completed sessions so the plan shows history
  sessions.filter(s => s.date < t).forEach((s, i, arr) => {
    if (i === arr.length - 2) { state.skipped[s.id] = true; return; }
    const p = (s.duration / s.distance) * 1000 * (1 + (i % 3 - 1) * 0.015);
    state.log[s.id] = { date: s.date, distance: Math.round(s.distance * 1.01), duration: Math.round(s.distance * 1.01 / 1000 * p), avgPace: p, splits: [], steps: [], rpe: [4, 6, 3, 7][i % 4], feel: 'ok', paceMiss: 0, source: 'sample', type: s.type, at: Date.now() - (arr.length - i) * 86400000 };
  });
  rebuild();
}

/* =============== Render: shell =============== */
function render() {
  const app = $('#view');
  if (!plan) { app.innerHTML = ''; return; }
  const cw = weekOf(today());
  $('#topmeta').innerHTML = `${esc(E.DIST_LABEL[state.profile.goal])} plan<br><b>Week ${cw.n} of ${plan.N}</b> · ${cw.phase[0].toUpperCase() + cw.phase.slice(1)}`;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.view === view ? 'page' : 'false'));
  app.innerHTML = ({ today: viewToday, plan: viewPlan, paces: viewPaces, you: viewYou })[view]();
  if (view === 'plan') { const cur = $('details.wk[data-cur]'); if (cur && !renderedPlanOnce) { renderedPlanOnce = true; cur.scrollIntoView({ block: 'center' }); } }
}
let renderedPlanOnce = false;

function sampleBanner() {
  return state.sample ? `<div class="banner"><span>This is a <b>sample half-marathon plan</b> with a few example runs logged.</span><button class="btn sm primary" data-a="onboard">Build mine</button></div>` : '';
}

/* =============== Today =============== */
function viewToday() {
  const t = today();
  const cw = weekOf(t);
  const days = [...Array(7)].map((_, i) => E.addDays(cw.start, i));
  if (!selDay || selDay < cw.start || selDay > E.addDays(cw.start, 6)) selDay = t;
  const strip = days.map(d => {
    const ss = sessions.filter(s => s.date === d);
    const mk = ss.length ? (ss[0].log ? ICON.check : ss[0].skipped || (d < t) ? (ss[0].log ? ICON.check : ICON.cross) : `<span class="dot" style="background:${zColor(ss[0].mainZone)}"></span>`) : '';
    return `<button class="day ${d === t ? 'today' : ''}" data-a="day" data-d="${d}" aria-pressed="${d === selDay}"><span class="wd">${WD[E.weekday(d)].toUpperCase().slice(0, 2)}</span><span class="dn num">${E.parse(d).getDate()}</span><span class="mk">${mk}</span></button>`;
  }).join('');
  const sel = sessions.filter(s => s.date === selDay);
  const hero = sel.length ? sel.map(heroCard).join('') : restCard(selDay);
  const done = cw.sessions.reduce((a, s) => a + (s.log ? s.log.distance : 0), 0);
  const planned = cw.sessions.reduce((a, s) => a + s.distance, 0);
  const upcoming = sessions.filter(s => s.date > selDay && !s.log && !s.skipped).slice(0, 3);
  const notice = latestNotice();
  const race = raceSession();
  return `${sampleBanner()}${notice}
  <section class="card" style="padding:10px 8px"><div class="week">${strip}</div></section>
  ${hero}
  <section class="card stack">
    <div class="row between"><span class="eyebrow">Week ${cw.n} · ${cw.phase}</span><span class="num" style="font-weight:700">${E.fmtDist(done, U())} / ${E.fmtDist(planned, U())} ${U()}</span></div>
    <div class="bar"><i style="width:${Math.min(100, done / Math.max(1, planned) * 100).toFixed(0)}%"></i></div>
    <div class="muted" style="font-size:13px">${cw.sessions.filter(s => s.log).length} of ${cw.sessions.length} sessions done${race ? ` · ${Math.max(0, E.daysBetween(t, race.date))} days to race day` : ''}</div>
  </section>
  ${upcoming.length ? `<div class="sec-h"><h2>Coming up</h2></div><section class="card list" style="padding-block:4px">${upcoming.map(itemRow).join('')}</section>` : ''}`;
}
function heroCard(s) {
  const st = status(s);
  const lg = s.log;
  const statusLine = st === 'done' ? `<span class="chip" style="background:var(--good-soft);color:var(--good)">Completed</span>` : st === 'skipped' ? `<span class="chip">Skipped</span>` : st === 'missed' ? `<span class="chip" style="color:var(--bad)">Missed</span>` : '';
  return `<section class="card hero">
    <div class="row between"><span class="eyebrow">${esc(rel(s.date))} · ${esc(E.ZONES[s.mainZone].label)}</span>${statusLine}</div>
    <div><h1 class="h-display t">${esc(s.title)}</h1><div class="muted">${esc(s.summary)}</div></div>
    ${profileSVG(s)}
    <div class="stats">
      ${lg ? `<div class="stat"><div class="v">${E.fmtDist(lg.distance, U(), 2)}<small>${U()}</small></div><div class="l">Distance</div></div>
             <div class="stat"><div class="v">${E.fmtTime(lg.duration)}</div><div class="l">Time</div></div>
             <div class="stat"><div class="v">${E.fmtPace(lg.avgPace, U())}<small>/${U()}</small></div><div class="l">Avg pace</div></div>`
           : `<div class="stat"><div class="v">${E.fmtDist(s.distance, U())}<small>${U()}</small></div><div class="l">Distance</div></div>
             <div class="stat"><div class="v">${Math.round(s.duration / 60)}<small>min</small></div><div class="l">Est. time</div></div>
             ${s.type === 'runwalk' || s.mainZone === 'effort' ? '' : `<div class="stat"><div class="v">${E.fmtPace(s.zones[keyZone(s)][0], U())}<small>/${U()}</small></div><div class="l">Key pace</div></div>`}`}
    </div>
    <div class="btns">
      ${!lg && !s.skipped ? `<button class="btn primary" data-a="run" data-id="${s.id}">${ICON.play} Start run</button>` : ''}
      <button class="btn" data-a="open" data-id="${s.id}">${lg ? 'See results' : 'Workout details'}</button>
    </div>
  </section>`;
}

    ${volumeChart(cw)}

  </section>

function volumeChart(cw) {
  const ws = plan.weeks, n = ws.length;
  const W = 340, H = 130, padL = 26, padB = 18, padT = 8;
  const max = Math.max(...ws.map(w => w.plannedKm)) * 1.1 || 1;
  const step = Math.ceil(max / 3 / 10) * 10 || 10;
  const bw = (W - padL) / n;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const grid = [...Array(4)].map((_, i) => i * step).filter(v => v <= max).map(v => `<line class="grid" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 5}" y="${y(v) + 3}" text-anchor="end">${U() === 'mi' ? Math.round(v / 1.609) : v}</text>`).join('');
  const bars = ws.map((w, i) => {
    const x = padL + i * bw + bw * 0.15, bwi = bw * 0.7;
    const ph = `var(--ph-${w.phase})`;
    const doneH = Math.min(w.doneKm, w.plannedKm * 1.3);
    return `<rect x="${x}" y="${y(w.plannedKm)}" width="${bwi}" height="${y(0) - y(w.plannedKm)}" rx="2" fill="${ph}" opacity="${w.n < cw.n ? .35 : w === cw ? 1 : .7}"/>`
      + (doneH ? `<rect x="${x}" y="${y(doneH)}" width="${bwi}" height="${y(0) - y(doneH)}" rx="2" fill="var(--ink)" opacity=".75"/>` : '')
      + ((i % (n > 14 ? 3 : 2) === 0 || i === n - 1) ? `<text x="${x + bwi / 2}" y="${H - 4}" text-anchor="middle">${w.n}</text>` : '');
  }).join('');
  const nx = padL + (cw.n - 0.5) * bw;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly distance by week">${grid}${bars}<line class="now" x1="${nx}" x2="${nx}" y1="${padT - 4}" y2="${y(0)}"/></svg>
  <div class="legend"><span><i class="dot" style="background:var(--ink);opacity:.75"></i>Completed</span><span><i class="dot" style="border:1.5px dashed var(--ink);background:none"></i>This week</span></div>`;
}
